    <a class="brand" href="index.html"><img src="assets/logo.png" alt="League of NARPS" class="brand-logo"><small>EST. 2011</small></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav">
      <a href="index.html">Home</a>
      <a href="champions.html" aria-current="page">Champions</a>
      <div class="nav-dropdown" id="history-dropdown">
        <button type="button" class="nav-dropdown-toggle" aria-expanded="false" aria-haspopup="true">League History <span class="nav-caret" aria-hidden="true">&#9662;</span></button>
        <div class="nav-dropdown-menu">

    </nav>

<section style="padding-top:48px;">
  <div class="wrap">
    <div class="section-head">
      <h2 class="section-title">Champions</h2>
      <span class="section-sub">Chronological · 15 Championships, 2011–2025</span>
    </div>
    <div class="champ-grid" id="champ-grid"></div>
  </div>
</section>

<footer>
  <div class="wrap">League of NARPS — league history archive · built from the official league spreadsheet</div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/script.js"></script>
<script>
  const container = document.getElementById('champ-grid');
  const chrono = CHAMPIONS.slice().sort((a,b) => a.year - b.year);
  container.innerHTML = chrono.map(c => `<div class="champ-pennant">
    <div class="champ-pennant-inner">
      <div class="champ-grommet champ-grommet--left"></div>
      <div class="champ-grommet champ-grommet--right"></div>
      <div class="champ-headline">NARPS<br>CHAMPION</div>
      <div class="champ-ribbon">${c.owner.toUpperCase()}</div>
      <div class="champ-pennant-year">${c.year}</div>
    </div>
  </div>`).join('');
</script>
</body>
